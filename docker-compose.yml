version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000: 5000"
    env_file:
      - .env
    depends_on:
      - db
    profiles:
      - dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000: 3000"
    env_file:
      - .env
    depends_on:
      - backend
    profiles:
      - dev

  db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - dev
